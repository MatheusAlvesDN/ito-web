name: Build Android APK

# Apenas manual: o app web depende do backend (/api e /ws), que o APK não embute.
on:
  workflow_dispatch: # Permite rodar manualmente na aba Actions

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o seu código
      - name: Checkout source
        uses: actions/checkout@v3

      # 2. Instala o Java (necessário para Android)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Instala o Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      # 4. Instala Dependências (Modo seguro com npm install)
      - name: Install Dependencies
        run: npm install

      # 5. Compila o site React (Gera a pasta dist)
      - name: Build Web App
        run: npm run build

      # 6. Configura o Capacitor e gera a pasta Android (Auto-recuperação)
      - name: Setup Capacitor & Android
        run: |
          # Garante que as ferramentas do Capacitor estão instaladas
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Se o arquivo de config não existir, cria um automaticamente
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "Configuração ausente. Inicializando Capacitor automaticamente..."
            npx cap init ITO com.ito.app --web-dir=dist
          fi

          # Adiciona a plataforma Android se a pasta não existir
          if [ ! -d "android" ]; then
            echo "Pasta Android ausente. Criando..."
            npx cap add android
          fi

          # Sincroniza o código compilado com a pasta Android
          npx cap sync android

      # 7. Gera o APK usando o Gradle (Sistema do Android)
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Faz o Upload do APK para você baixar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ito-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk