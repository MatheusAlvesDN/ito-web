# Configuração do Alembic. Uso (de dentro de backend/):
#   .venv/bin/alembic upgrade head
#   .venv/bin/alembic revision --autogenerate -m "descricao"
# A URL do banco vem de app.core.config.settings.DATABASE_URL (não daqui).
# O app aplica as migrações sozinho ao iniciar (app/core/migrations.py).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
